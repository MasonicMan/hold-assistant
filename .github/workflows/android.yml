name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classifier harness (Python)
        working-directory: python
        run: |
          pip install -r requirements.txt
          python -m pytest -q
          python run_harness.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests (Kotlin)
        working-directory: android
        run: ./gradlew :core:test

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --console=plain 2>&1 | tee build.log

      # Surface compiler and Gradle errors as annotations, readable via the API.
      - name: Report build errors
        if: failure()
        working-directory: android
        run: |
          [ -f build.log ] || exit 0
          grep -E "^e: |error:|ERROR:|What went wrong|^> |Duplicate class|Caused by" build.log \
            | grep -v "^> Task" | head -120 > errors.txt || true
          split -l 12 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build error::$msg"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: hold-assistant-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publish as the "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk hold-assistant.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest hold-assistant.apk --prerelease \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Download hold-assistant.apk on your phone to install or update."
